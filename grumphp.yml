grumphp:
  stop_on_failure: true
  process_timeout: 900
  hide_circumvention_tip: true
  parallel:
    # GrumPHP runs its tasks concurrently by default, which puts PHPStan and the feature tests on the
    # build box at the same time. PHPStan then walks the fixture tree while ParaTest is creating and
    # deleting the per-worker var directories under it, and dies with "Failed to open directory" - and
    # the two suites fight over the same cores, which is what the feature tests' timeouts are sized
    # against. They are cheap enough to run one after another.
    enabled: false
  testsuites:
    complete:
      tasks:
        - phpcsfixer
        - phpcs
        - phpstan_src
        - phpstan_tests
        - phpunit_unit
        - paratest_feature
    tests:
      tasks:
        - phpunit_unit
        - paratest_feature
  tasks:
    phpcs:
      standard: 'phpcs.xml'
      tab_width: 4
      whitelist_patterns: [ ]
      encoding: utf-8
      sniffs: [ ]
      triggered_by: [ php ]
    phpcsfixer:
      cache_file: '.php-cs-fixer.cache'
      allow_risky: true
      config: '.php-cs-fixer.dist.php'
      using_cache: true
      config_contains_finder: true
      verbose: false
      diff: true
      triggered_by: ['php']
    phpstan_src:
      autoload_file: ~
      configuration: 'phpstan.neon'
      memory_limit: '512M'
      use_grumphp_paths: false
      triggered_by: [ 'php' ]
      metadata:
        task: phpstan
    phpstan_tests:
      autoload_file: ~
      configuration: 'phpstan.tests.neon'
      memory_limit: '512M'
      use_grumphp_paths: false
      triggered_by: [ 'php' ]
      metadata:
        task: phpstan
    phpunit_unit:
      config_file: phpunit.xml
      testsuite: UnitTests
      always_execute: true
      metadata:
        task: phpunit
    # Feature tests run in parallel - each worker gets its own ports, var directory, pid file and
    # database, see SwooleBundle\SwooleBundle\Tests\Helper\TestToken. Process isolation comes from
    # phpunit.feature.xml, which the workers load; the task has no flag for it.
    paratest_feature:
      configuration: phpunit.feature.xml
      testsuite: FeatureTests
      processes: 4
      always_execute: true
      metadata:
        task: paratest
